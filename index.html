  :root{
    --page-bg:#efe9e0;
    --page-fg:#4a4137;
    --glow:rgba(201,169,110,.30);
    --paper:#fdfcf9;
    --env:#f0e9dc;
    --env-dark:#e2d8c6;
    --env-edge:#d3c6ae;
    --ink:#22201c;
    --rule:#cfc6b6;
    --gold:#b9974f;
    --cw:min(360px, 74vw, 40svh);
    --ch:calc(var(--cw) * 1.4069);
    --ew:calc(var(--cw) * 1.075);
    --eh:calc(var(--ch) * 1.055);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --page-bg:#171410;
      --page-fg:#cdc2b1;
      --glow:rgba(201,169,110,.16);
    }
  }
  :root[data-theme="dark"]{
    --page-bg:#171410;
    --page-fg:#cdc2b1;
    --glow:rgba(201,169,110,.16);
  }

  *{box-sizing:border-box}
  body{
    margin:0; min-height:100svh;
    background:var(--page-bg);
    color:var(--page-fg);
    font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:16px; padding-block:20px;
    overflow:hidden;
  }
  body::before{
    content:''; position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(60% 45% at 50% 42%, var(--glow), transparent 70%);
  }

  /* ---------- stage ---------- */
  .stage{
    position:relative;
    width:var(--ew); height:var(--eh);
    perspective:1600px;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:8px;
    flex:0 0 auto;
  }
  .stage > *{position:absolute; left:50%; top:50%}

  /* ---------- envelope ---------- */
  .env-back,.env-front{
    width:var(--ew); height:var(--eh);
    margin-left:calc(var(--ew) / -2); margin-top:calc(var(--eh) / -2);
    border-radius:4px;
    transition:opacity .7s ease, transform .9s cubic-bezier(.4,0,.2,1);
  }
  .env-back{
    z-index:1;
    background:var(--env-dark);
    box-shadow:0 26px 50px -18px rgba(60,44,22,.45), 0 2px 6px rgba(60,44,22,.18);
  }
  .env-front{
    z-index:3;
    background:linear-gradient(168deg, var(--env) 0%, var(--env) 58%, var(--env-dark) 100%);
    border:1px solid var(--env-edge);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.7), 0 -6px 14px -10px rgba(60,44,22,.5);
  }
  /* the two folded side-wings of the envelope front */
  .env-front::before,.env-front::after{
    content:''; position:absolute; top:0; bottom:0; width:42%;
    background:linear-gradient(to right, rgba(0,0,0,.045), rgba(0,0,0,0));
  }
  .env-front::before{left:0; clip-path:polygon(0 0, 100% 46%, 100% 54%, 0 100%)}
  .env-front::after{right:0; transform:scaleX(-1); clip-path:polygon(0 0, 100% 46%, 100% 54%, 0 100%)}

  .flap{
    z-index:4;
    width:var(--ew); height:calc(var(--eh) * .52);
    margin-left:calc(var(--ew) / -2); margin-top:calc(var(--eh) / -2);
    background:linear-gradient(to bottom, var(--env) 0%, var(--env-dark) 100%);
    clip-path:polygon(0 0, 100% 0, 50% 100%);
    transform-origin:top center;
    transform:rotateX(0deg);
    transition:transform .85s cubic-bezier(.62,-0.18,.35,1.1), z-index 0s .42s;
    filter:drop-shadow(0 4px 6px rgba(60,44,22,.22));
  }
  .seal{
    position:absolute; left:50%; top:calc(var(--eh) * .52);
    width:calc(var(--cw) * .17); height:calc(var(--cw) * .17);
    margin-left:calc(var(--cw) * -.085); margin-top:calc(var(--cw) * -.085);
    border-radius:50%;
    background:radial-gradient(circle at 34% 30%, #c8a45e, #9d7a34 62%, #7d5f26);
    box-shadow:0 2px 6px rgba(60,44,22,.4), inset 0 0 0 1px rgba(255,255,255,.18);
    display:flex; align-items:center; justify-content:center;
    color:#fdf6e6; font-size:calc(var(--cw) * .062); letter-spacing:.04em;
    transition:opacity .35s ease, transform .5s ease;
    z-index:5; pointer-events:none;
  }

  /* ---------- card ---------- */
  .card{
    z-index:2;
    width:var(--cw); height:var(--ch);
    margin-left:calc(var(--cw) / -2); margin-top:calc(var(--ch) / -2);
    transform-style:preserve-3d;
    transform:translateY(calc(var(--ch) * .035)) scale(.955);
    transition:transform 1.05s cubic-bezier(.34,.02,.2,1);
  }
  .card-inner{
    position:absolute; inset:0;
    transform-style:preserve-3d;
    transition:transform 1s cubic-bezier(.4,.02,.2,1);
    border-radius:3px;
    box-shadow:0 22px 44px -16px rgba(50,36,16,.5), 0 3px 10px rgba(50,36,16,.22);
  }
  .face{
    position:absolute; inset:0;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:3px; overflow:hidden;
    background:var(--paper);
  }
  .face-back{transform:rotateY(180deg)}

  /* ----- front of the card ----- */
  .photo{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}
  .wash{
    position:absolute; inset:0;
    background:
      /* soft halo behind the centred type, so the small lines read
         without having to flatten the peaks across the full width */
      radial-gradient(74% 30% at 50% 27%, rgba(253,251,246,.50), rgba(253,251,246,0) 72%),
      linear-gradient(to bottom,
        rgba(253,251,246,.90) 0%,
        rgba(253,251,246,.84) 20%,
        rgba(253,251,246,.70) 30%,
        rgba(253,251,246,.46) 40%,
        rgba(253,251,246,.18) 50%,
        rgba(253,251,246,0) 60%);
  }
  .front-type{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center;
    color:var(--ink); text-align:center;
    padding-top:calc(var(--ch) * .024);
  }
  .std{
    font-size:calc(var(--cw) * .043); font-weight:400;
    letter-spacing:.34em; text-indent:.34em; text-transform:lowercase;
  }
  .script{
    font-family:'Parisienne', 'Snell Roundhand', 'Segoe Script', cursive;
    font-weight:400; line-height:.95; color:var(--ink);
  }
  .n1{font-size:calc(var(--cw) * .165); margin-top:calc(var(--ch) * .018)}
  .amp{
    font-size:calc(var(--cw) * .032); letter-spacing:.3em; text-indent:.3em;
    margin-top:calc(var(--ch) * .012);
  }
  .n2{font-size:calc(var(--cw) * .165); margin-top:calc(var(--ch) * .004)}
  .date{
    font-size:calc(var(--cw) * .082); font-weight:500;
    letter-spacing:.015em; margin-top:calc(var(--ch) * .020);
  }
  .place{
    font-size:calc(var(--cw) * .039); font-weight:500;
    letter-spacing:.2em; text-indent:.2em; margin-top:calc(var(--ch) * .008); font-weight:500;
  }

  /* ----- back of the card ----- */
  .face-back{
    background:var(--paper);
    display:flex; flex-direction:column; align-items:center;
    text-align:center; color:var(--ink);
    padding:calc(var(--cw) * .085) calc(var(--cw) * .1);
  }
  .face-back::before{
    content:''; position:absolute; inset:calc(var(--cw) * .028);
    border:1px solid rgba(34,32,28,.13); pointer-events:none;
  }
  .mono{
    margin-top:calc(var(--ch) * .045);
    font-size:calc(var(--cw) * .085); font-weight:400; letter-spacing:.02em;
    display:flex; align-items:center; gap:calc(var(--cw) * .012);
    line-height:1;
  }
  .mono .slash{
    width:1px; height:calc(var(--cw) * .13); background:rgba(34,32,28,.75);
    transform:rotate(22deg); display:block;
  }
  .mono .r{align-self:flex-start}
  .mono .a{align-self:flex-end}
  .bk-label{margin-top:calc(var(--ch) * .11); font-size:calc(var(--cw) * .048); font-weight:400}
  .bk-url{
    margin-top:calc(var(--ch) * .016); font-size:calc(var(--cw) * .049); font-weight:600;
    text-decoration:underline; text-underline-offset:.22em;
    color:var(--ink); word-break:break-all;
  }
  .bk-pass{margin-top:calc(var(--ch) * .014); font-size:calc(var(--cw) * .046); font-weight:400}
  .bk-copy{
    margin-top:calc(var(--ch) * .048); font-size:calc(var(--cw) * .045); font-weight:400;
    line-height:1.85; max-width:92%;
  }
  .qr{
    margin-top:auto; display:flex; flex-direction:column; align-items:center;
    gap:calc(var(--cw) * .022);
  }
  .qr svg{
    width:calc(var(--cw) * .30); height:calc(var(--cw) * .30); display:block;
    background:#fff;
  }
  .qr span{
    font-size:calc(var(--cw) * .034); letter-spacing:.22em; text-indent:.22em;
    text-transform:lowercase; color:rgba(34,32,28,.62);
  }

  /* ---------- states ---------- */
  .is-opening .flap{transform:rotateX(-172deg); z-index:0}
  .is-opening .seal{opacity:0; transform:scale(.7) translateY(6px)}
  .is-out .card{
    transform:translateY(calc(var(--ch) * -.26)) scale(.97);
    z-index:10;
  }
  .is-done .card{transform:translateY(0) scale(1); z-index:10}
  .is-done .env-back,.is-done .env-front,.is-done .flap{
    opacity:0; transform:translateY(calc(var(--eh) * .14));
  }
  .is-done .env-back{margin-left:calc(var(--ew) / -2); margin-top:calc(var(--eh) / -2)}
  .is-flipped .card-inner{transform:rotateY(180deg)}

  /* ---------- controls ---------- */
  .controls{
    display:flex; gap:10px; align-items:center; justify-content:center;
    flex-wrap:wrap; min-height:44px; margin-top:4px; z-index:20;
  }
  button{
    font-family:inherit; font-size:15px; letter-spacing:.14em; text-indent:.14em;
    text-transform:lowercase; color:var(--page-fg);
    background:transparent; border:1px solid currentColor; border-radius:2px;
    padding:9px 20px; cursor:pointer; opacity:.78;
    transition:opacity .25s ease, background .25s ease;
  }
  button:hover{opacity:1; background:rgba(185,151,79,.12)}
  button:focus-visible{outline:2px solid var(--gold); outline-offset:3px}
  .hint{
    font-size:15px; letter-spacing:.22em; text-indent:.22em; opacity:.7;
    text-transform:lowercase; user-select:none;
  }
  .tap{
    position:absolute; inset:0; z-index:30; cursor:pointer;
    background:transparent; border:0; padding:0;
  }
  [hidden]{display:none !important}

  /* ---------- sparkles ---------- */
  .spark{
    position:absolute; left:50%; top:50%; width:5px; height:5px; border-radius:50%;
    background:var(--gold); pointer-events:none; opacity:0; z-index:9;
  }
  @keyframes rise{
    0%{opacity:0; transform:translate(0,0) scale(.4)}
    18%{opacity:.85}
    100%{opacity:0; transform:translate(var(--dx), var(--dy)) scale(.2)}
  }

  @media (prefers-reduced-motion: reduce){
    .card,.card-inner,.flap,.env-back,.env-front,.seal{transition-duration:.01ms !important}
    .spark{display:none}
  }
</style>

        s.style.animation='rise '+(1100+Math.random()*900)+'ms ease-out '+(i*45)+'ms forwards';
        stage.appendChild(s);
        setTimeout(function(){ s.remove(); },2600+i*45);
      })(i);
    }
  }

  function open(){
    if(busy||opened) return;
    busy=true; opened=true;
    hint.hidden=true;
    tap.hidden=true;
    stage.classList.add('is-opening');
    var t1=reduce?10:620, t2=reduce?20:1450, t3=reduce?30:2400;
    setTimeout(function(){ stage.classList.add('is-out'); sparkle(); }, t1);
    setTimeout(function(){ stage.classList.add('is-done'); }, t2);
    setTimeout(function(){
      flip.hidden=false; again.hidden=false; busy=false;
      card.style.cursor='pointer';
    }, t3);
  }

  function doFlip(){
    if(busy) return;
    var f=stage.classList.toggle('is-flipped');
    flip.textContent=f?'turn back':'turn over';
  }

  function replay(){
    if(busy) return;
    busy=true;
    stage.classList.remove('is-flipped');
    flip.textContent='turn over';
    setTimeout(function(){
      stage.classList.remove('is-done','is-out','is-opening');
      flip.hidden=true; again.hidden=true;
      card.style.cursor='';
      setTimeout(function(){
        hint.hidden=false; tap.hidden=false; opened=false; busy=false;
      }, 900);
    }, 420);
  }

  tap.addEventListener('click', open);
  flip.addEventListener('click', doFlip);
  again.addEventListener('click', replay);
  card.addEventListener('click', function(){ if(opened && !busy) doFlip(); });
})();
</script>
